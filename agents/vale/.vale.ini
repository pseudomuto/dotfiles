; Executable form of agents/rules/style.md. That file states the standard for
; humans; this tree enforces it on every file an agent writes.
;
; Vale is used rather than a plain regex sweep because it parses source files
; with per-language tree-sitter grammars and lints only the comments. A banned
; word in a doc comment is reported; the same word in an identifier or string
; literal is not, which is the behaviour we want and the reason the old
; perl-based check was replaced.
;
; NB: rule files in styles/Muto MUST end in .yml. Vale reads no other
; extension, and a .yaml rule is skipped silently with no warning, leaving the
; whole ruleset inert while still exiting 0. Do not "fix" them to match the
; .yaml convention used elsewhere in this repo.

StylesPath = styles
MinAlertLevel = suggestion

; Vale's dictionary flags ordinary technical vocabulary, and the vocabulary
; file that would fix it resolves against the global styles path rather than
; this one. Spelling is the editor's job anyway.
Vale.Spelling = NO

; Formats to lint. Anything not listed is skipped entirely, so this doubles as
; the "is it prose" filter and the hook needs no allowlist of its own.
;
; Only add a language Vale has a tree-sitter grammar for. Without one it falls
; back to treating the file as plain text and lints the code as though it were
; prose. Shell was tried and removed for exactly that reason: it flagged a word
; inside an `echo` string. Verified good: md, go. Vale also ships grammars for
; c, cpp, cs, java, js, ts, php, py, rb, rs, lua, scala, hs, ex, clj, ps1.
[*.{md,go,js,ts}]
BasedOnStyles = Muto
